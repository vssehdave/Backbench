name: Research harness tests

on:
  pull_request:
    branches: [main]
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  research-tests:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip
          cache-dependency-path: requirements-qlib.txt
      - name: Run portable research tests
        run: python -m unittest discover -v
      - name: Install Qlib integration dependencies
        run: python -m pip install --disable-pip-version-check -r requirements-qlib.txt
      - name: Exercise Qlib binary provider
        run: python test_qlib_provider.py -v
